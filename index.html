<title>Hyrox Trainingslog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* Layout: one-screen mobile app. Sticky header, scrolling content, fixed bottom tab bar. Whoop-like: black ground, one green accent, big tabular numbers, thin hairlines. Dark by choice. */
:root{
  --bg:#0a0c0f; --surface:#13171c; --surface2:#1b2027; --line:#252c35; --line2:#323b46;
  --fg:#eef2f5; --fg2:#9aa5b1; --fg3:#5d6875;
  --accent:#16e36e; --accent-ink:#052a15; --accent-dim:rgba(22,227,110,.14);
  --warn:#ffb340; --danger:#ff5c5c; --blue:#4da3ff; --purple:#a78bfa;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
html,body{height:100%}
button,a,input,select,textarea,.check,.iconbtn,[data-goto],[data-col]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#toast{pointer-events:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.muted{color:var(--fg2)}.dim{color:var(--fg3)}
.num{font-weight:800;letter-spacing:-.02em}

#app{display:flex;flex-direction:column;height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,12,15,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
header.top .title{font-size:17px;font-weight:800;letter-spacing:-.01em}
header.top .sub{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,15,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--fg3);font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--surface2);color:var(--fg2);white-space:nowrap}
.chip.hyrox{background:rgba(22,227,110,.14);color:var(--accent)}
.chip.run{background:rgba(77,163,255,.14);color:var(--blue)}
.chip.gym{background:rgba(167,139,250,.16);color:var(--purple)}
.chip.bike{background:rgba(255,179,64,.14);color:var(--warn)}
.chip.other{background:var(--surface2);color:var(--fg2)}
.chip.race{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line2);min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--fg2)}
.iconbtn:active{background:var(--surface2)}

/* day header */
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead .ring{width:64px;height:64px;flex:none;position:relative}
.dayhead .ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.dayhead .ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .d{font-size:22px;font-weight:800;letter-spacing:-.02em}
.daynav .w{font-size:12px;color:var(--fg2)}

/* session card */
.sess{display:flex;flex-direction:column;gap:12px}
.sess .lines{white-space:pre-line;color:var(--fg2);font-size:14px;line-height:1.5}
.blocks{display:flex;flex-direction:column;gap:8px}
.blk{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.5;font-weight:500}
.blk .bh{font-weight:800;color:var(--accent);margin-bottom:2px}
.sess.done{border-color:rgba(22,227,110,.35)}
.targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.t{background:var(--surface2);border-radius:var(--r-sm);padding:8px 10px}
.t .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.t .v{font-size:18px;font-weight:800;letter-spacing:-.02em}
.t .v small{font-size:11px;font-weight:600;color:var(--fg2);margin-left:2px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:700}
input.in,select.in,textarea.in{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;font-weight:600}
textarea.in{min-height:64px;resize:vertical;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--fg2);min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* workout */
.ex{display:flex;flex-direction:column;gap:10px}
.ex .name{font-size:16px;font-weight:800;letter-spacing:-.01em}
.ex .meta{font-size:12px;color:var(--fg2)}
.sugg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--accent-dim);color:var(--accent)}
.sugg.hold{background:var(--surface2);color:var(--fg2)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr 40px;gap:6px;align-items:center}
.sets.norpe{grid-template-columns:28px 1fr 1fr 44px}
.sets .h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:700;text-align:center}
.sets .n{font-size:12px;color:var(--fg3);text-align:center;font-weight:700}
.sets input{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:0 6px;height:44px;font-size:17px;font-weight:700;text-align:center}
.sets input.prev{color:var(--fg3);font-weight:600}
.sets input:focus{border-color:var(--accent)}
.sets input::placeholder{color:var(--fg3);font-style:italic;font-weight:600}
.ok.on~input{}
.sets .ok{width:40px;height:44px;border-radius:10px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:var(--fg3)}
.sets .ok.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sets .ok svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn.wa{background:#25D366;color:#06130a;border-color:#25D366;text-decoration:none}
.ovr.next{border-color:rgba(22,227,110,.45);background:rgba(22,227,110,.06)}
.pchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--fg2);border:1px solid var(--line)}.pchip.on{background:var(--accent);color:#06130a;border-color:var(--accent)}
.prevline{font-size:12px;color:var(--fg3)}
.prevline b{color:var(--fg2);font-weight:700}
.exactions{display:flex;gap:8px;flex-wrap:wrap}
.exactions .btn{flex:1}
.pr{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--accent)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;cursor:pointer;touch-action:none}
.sheet{cursor:auto;touch-action:pan-y}
.sheet .x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.sheet .x .icon{width:16px;height:16px}
body.sheet-open main{overflow:hidden}
.sheet{position:relative;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line2);width:100%;max-height:85%;display:flex;flex-direction:column;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;min-height:0}
.lib{display:flex;flex-direction:column;gap:4px}
.lib button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:10px;text-align:left;border:1px solid transparent}
.lib button:active{background:var(--surface2)}
.lib button.cur{border-color:var(--accent)}
.lib .m{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{white-space:nowrap;padding:7px 11px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--fg2)}
.filters button.on{background:var(--accent);color:var(--accent-ink)}

/* schema */
.week{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:none}
main>*{flex:none}
.week>button.wh{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);text-align:left}
.week.cur>button.wh{border-left:3px solid var(--accent)}
.week .days{border-top:1px solid var(--line)}
.week .dr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.week .dr:last-child{border-bottom:0}
.week .dr .dn{width:34px;font-size:11px;font-weight:800;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em}
.week .dr .dd{width:40px;font-size:12px;color:var(--fg2)}
.week .dr.today .dn{color:var(--accent)}
.dots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.dot.on{background:var(--accent)}.dot.half{background:var(--warn)}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.tile .v small{font-size:12px;color:var(--fg2);font-weight:600;margin-left:3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2);display:block}
.heat i.on{background:var(--accent)}.heat i.half{background:rgba(22,227,110,.4)}.heat i.miss{background:rgba(255,92,92,.35)}.heat i.today{outline:2px solid var(--fg);outline-offset:-2px}
.chart{width:100%;height:150px;display:block}
.hist{display:flex;flex-direction:column}
.hist .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist .r:last-child{border-bottom:0}
.exlist button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.exlist button:last-child{border-bottom:0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;z-index:30;font-weight:600;font-size:14px;text-align:center}
.sync{font-size:11px;color:var(--fg3);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg3);display:inline-block}
.sync.ok i{background:var(--accent)}.sync.local i{background:var(--warn)}
.ex.complete{border-color:rgba(22,227,110,.45)}
.ex.complete .name::after{content:' ✓';color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
.card,.btn{transition:border-color .15s,background .15s,transform .12s}
.btn:active,.check:active,.ok:active,.ovr:active{transform:scale(.97)}
.dayhead .ring circle:last-child{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
main>.card,main>.daynav,main>.tiles,main>.week{animation:rise .28s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.03s}main>*:nth-child(3){animation-delay:.06s}main>*:nth-child(4){animation-delay:.09s}main>*:nth-child(5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ok.on svg,.check.on svg{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.toast{animation:rise .2s both}
.sheet{animation:slideup .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.chip.race{animation:none}
}

.filters button.on{background:var(--accent);color:var(--accent-ink)}
.filters{flex:none}
.tile .v small{font-size:12px}
.ov{display:flex;flex-direction:column;gap:6px}
.hub{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px}
.hub .hi{font-size:26px;width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2)}
.hub.run{border-color:rgba(77,163,255,.35)}.hub.gym{border-color:rgba(167,139,250,.4)}.hub.wod{border-color:rgba(22,227,110,.35)}
.hero{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(22,227,110,.16),rgba(22,227,110,.04));border:1px solid rgba(22,227,110,.35);color:inherit;text-decoration:none}
.hero.gym{background:linear-gradient(135deg,rgba(167,139,250,.18),rgba(167,139,250,.04));border-color:rgba(167,139,250,.4)}
.hero.run{background:linear-gradient(135deg,rgba(77,163,255,.18),rgba(77,163,255,.04));border-color:rgba(77,163,255,.4)}
.hero.bike{background:linear-gradient(135deg,rgba(255,179,64,.18),rgba(255,179,64,.04));border-color:rgba(255,179,64,.4)}
.hero .ht{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero .hs{font-size:13px;color:var(--fg2);font-weight:600}
.hero .hl{font-size:13px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovr{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface2);border-radius:10px;color:inherit;text-decoration:none;min-width:0}
.ovr .grow{min-width:0}.ovr b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--fg2)}
.pchip .icon{width:16px;height:16px}
input[type=file]{color:var(--fg2)}
input[type=date]{min-height:44px}
</style>

<div id="app">
  <header class="top">
    <div class="stack" style="gap:0;min-width:0"><div class="title" id="hTitle">Hyrox Trainingslog</div><div class="sub" id="hSub"></div></div>
    <div class="row" style="gap:8px;flex:none"><button class="pchip" id="pchip" hidden></button><div class="sync" id="sync"><i></i><span></span></div></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="sheet"></div>
<div id="toast" hidden></div>

const timers={},inflight={},pending={};
const COLL={profiles:'profiles',settings:'settingsAll',programs:'programs',days:'days',sessions:'sessions'};
function persist(coll,id,data,delay=500){
  S[COLL[coll]][id]=data; if(coll==='settings')applyCustom(); saveLocal();
  if(!S.db) return; clearTimeout(timers[coll+'/'+id]); timers[coll+'/'+id]=setTimeout(()=>flush(coll,id),delay);
}
function removeDoc(coll,id){delete S[COLL[coll]][id];saveLocal();if(S.db)S.db.doc(coll+'/'+id).delete().catch(()=>{})}
async function flush(coll,id){
  const key=coll+'/'+id; if(inflight[key]){pending[key]=true;return} inflight[key]=true;
  try{const data=S[COLL[coll]][id];if(data==null)await S.db.doc(key).delete();else await S.db.doc(key).set(JSON.parse(JSON.stringify(data)));setSync('ok')}catch(e){setSync('local')}
  inflight[key]=false; if(pending[key]){pending[key]=false;flush(coll,id)}
}
function setSync(state){S.storage=state;const el=document.getElementById('sync');el.className='sync '+state;el.querySelector('span').textContent=state==='ok'?'cloud':state==='local'?'local':'…'}
async function initDb(){
  try{
    const db=await window.claude?.use?.('db'); if(!db){setSync('local');migrateOld();ensureProfile();render();return}
    S.db=db;
    const [pr,st,pg,ds,ss]=await Promise.all(['profiles','settings','programs','days','sessions'].map(c=>db.collection(c).get()));
    const inDb={profiles:new Set(),settings:new Set(),programs:new Set(),days:new Set(),sessions:new Set()};
    pr.docs.forEach(d=>{if(d.exists){S.profiles[d.id]=d.data();inDb.profiles.add(d.id)}}); st.docs.forEach(d=>{if(d.exists){S.settingsAll[d.id]=Object.assign(defSettings(),d.data());inDb.settings.add(d.id)}});
    pg.docs.forEach(d=>{if(d.exists){S.programs[d.id]=d.data();inDb.programs.add(d.id)}}); ds.docs.forEach(d=>{if(d.exists){S.days[d.id]=d.data();inDb.days.add(d.id)}}); ss.docs.forEach(d=>{if(d.exists){S.sessions[d.id]=d.data();inDb.sessions.add(d.id)}});
    applyCustom(); saveLocal(); setSync('ok'); migrateOld(); ensureProfile(); render();
    // push docs that only exist locally (created offline or before the connection came up)
    Object.keys(COLL).forEach(coll=>Object.keys(S[COLL[coll]]).forEach(id=>{if(!inDb[coll].has(id)&&id.includes('__')||(coll==='profiles'&&!inDb.profiles.has(id))||(coll==='settings'&&!inDb.settings.has(id)&&id!=='main'))flush(coll,id)}));
  }catch(e){setSync('local');migrateOld();ensureProfile();render()}
}

function migrateOld(){
  const oldDays={},oldSess={};let oldSet=null;
  Object.entries(S.days).forEach(([k,v])=>{if(!k.includes('__'))oldDays[k]=v}); Object.entries(S.sessions).forEach(([k,v])=>{if(!k.includes('__'))oldSess[k]=v});
  if(S.settingsAll.main){oldSet=S.settingsAll.main}
  try{const j=JSON.parse(localStorage.getItem(LS_OLD)||'null');if(j){Object.entries(j.days||{}).forEach(([k,v])=>{if(!oldDays[k])oldDays[k]=v});Object.entries(j.sessions||{}).forEach(([k,v])=>{if(!oldSess[k])oldSess[k]=v});if(!oldSet&&j.settings)oldSet=j.settings}}catch(e){}
  if(!Object.keys(oldDays).length&&!Object.keys(oldSess).length&&!oldSet&&Object.keys(S.profiles).length) return;
  if(!Object.keys(oldDays).length&&!Object.keys(oldSess).length&&!oldSet) return;
  const pid='danny'; if(!S.profiles[pid]) persist('profiles',pid,{id:pid,name:'Danny',color:'#16e36e',created:Date.now()},0);
  const st=Object.assign(defSettings(),S.settingsAll[pid]||{});
  const pk=progKey(pid,'hyrox10');
  if(!S.programs[pk]){const p=buildHyrox('2026-09-21');Object.assign(p,{id:'hyrox10',pid,created:Date.now()});persist('programs',pk,p,0)}
  st.activeProgram='hyrox10';
  if(oldSet){st.bodyweight=oldSet.bodyweight??st.bodyweight;st.lang=oldSet.lang||st.lang;st.customEx=(oldSet.customEx||[]).map(x=>({...x,pid}));if(oldSet.swaps&&Object.keys(oldSet.swaps).length)st.swaps={hyrox10:oldSet.swaps}}
  persist('settings',pid,st,0);
  Object.entries(oldDays).forEach(([k,v])=>{const nk=`${pid}__hyrox10__${k}`;if(!S.days[nk]){const d={date:k,s:{},extra:v.extra||[]};if(v.done!=null||v.dist!=null||v.time!=null||v.rpe!=null||v.note||v.choice)d.s[0]={done:!!v.done,dist:v.dist??null,time:v.time??null,rpe:v.rpe??null,note:v.note||'',choice:v.choice||null};persist('days',nk,d,0)}removeDoc('days',k)});
  Object.entries(oldSess).forEach(([k,v])=>{const m=k.match(/^(\d{4}-\d{2}-\d{2})_(t\d)(?:_x(\d+))?$/);if(!m){removeDoc('sessions',k);return}const nk=`${pid}__hyrox10__${m[1]}__${m[2]}${m[3]!=null?'__x'+m[3]:''}`;if(!S.sessions[nk]){persist('sessions',nk,{...v,id:nk,pid,prog:'hyrox10'},0)}removeDoc('sessions',k)});
  if(S.settingsAll.main)removeDoc('settings','main');
  try{localStorage.removeItem(LS_OLD)}catch(e){}
  if(!S.pid)S.pid=pid; saveLocal();
}
function ensureProfile(){
  const ids=Object.keys(S.profiles);
  if(!S.pid||!S.profiles[S.pid]) S.pid=ids[0]||null;
  if(S.pid){S.lang=settings().lang||'nl'}
  saveLocal();
}

/* ===================== PROGRAM HELPERS ===================== */
function planFor(d,p=prog()){
  if(!p) return null; const start=parseKey(p.start); const w=Math.floor((d-start)/864e5/7)+1; if(w<1||w>p.weeks.length) return null;
  return {w,dk:DAYS[(d.getDay()+6)%7]};
}
function dateFor(w,di,p=prog()){return addDays(parseKey(p.start),(w-1)*7+di)}
const dayIdx=d=>(d.getDay()+6)%7;
const dayKey=k=>`${S.pid}__${prog().id}__${k}`;
function dayDoc(k){return S.days[dayKey(k)]||{date:k,s:{},extra:[]}}
function sessState(k,idx){return (dayDoc(k).s||{})[idx]||{}}
function daySessions(k){
  const p=prog(); if(!p) return []; const pl=planFor(parseKey(k)); if(!pl) return [];
  const arr=(p.weeks[pl.w-1].days[pl.dk]||[]); const list=[]; const seen={};
  arr.forEach((s,idx)=>{if(s.kind==='gym'){if(!p.templates[s.tpl])return;const n=(seen[s.tpl]=(seen[s.tpl]||0)+1);list.push({idx,kind:'gym',tpl:s.tpl,id:`${dayKey(k)}__${s.tpl}${n>1?'_'+n:''}`,extra:false})}else list.push({idx,kind:'cardio',...s})});
  (dayDoc(k).extra||[]).forEach((x,i)=>{if(typeof x==='string'){if(p.templates[x])list.push({idx:'x'+i,kind:'gym',tpl:x,id:`${dayKey(k)}__${x}__x${i}`,extra:true,xi:i})}else if(x&&x.kind==='cardio')list.push({idx:'x'+i,kind:'cardio',...x,extra:true,xi:i});else if(x&&x.kind==='adhoc')list.push({idx:'x'+i,kind:'gym',tpl:ADHOC,id:`${dayKey(k)}__adhoc__x${i}`,extra:true,adhoc:true,xi:i})});
  return list;
}
function isDone(k,s){return s.kind==='gym'?!!S.sessions[s.id]?.done:!!sessState(k,s.idx).done}
function dayStatus(k){const l=daySessions(k);return {total:l.length,done:l.filter(s=>isDone(k,s)).length}}
function weekOfToday(){const pl=planFor(today());return pl?pl.w:null}
/* estimated minutes & load */
function progMinutes(k,s){const st=sessState(k,s.idx);if(st.time)return st.time;const km=st.dist??s.km;return {hyrox:60,other:45,race:80,bike:60,run:km?Math.round(km*5.5):45}[s.type]||45}
function gymMinutes(sess){let n=0;sess.exercises.forEach(e=>n+=loggedSets(e).length);return n?Math.round(5+n*2.5):0}
function gymRpe(sess){const r=[];sess.exercises.forEach(e=>loggedSets(e).forEach(s=>{if(s.rpe!=null)r.push(s.rpe)}));return r.length?r.reduce((a,b)=>a+b,0)/r.length:7.5}
function weekLoad(w){
  const o={load:0,minutes:0,km:0,sessions:0,rpeSum:0,rpeN:0,vol:0,sets:0,prs:0,gym:0,planned:0,done:0};
  for(let di=0;di<7;di++){const k=fmtKey(dateFor(w,di));daySessions(k).forEach(s=>{o.planned++;if(!isDone(k,s))return;o.done++;
    if(s.kind==='cardio'){const st=sessState(k,s.idx);const m=progMinutes(k,s),r=st.rpe??s.rpe??6;o.load+=m*r;o.minutes+=m;o.km+=st.dist??s.km??0;o.sessions++;o.rpeSum+=r;o.rpeN++}
    else{const x=S.sessions[s.id];const m=gymMinutes(x),r=gymRpe(x);o.load+=m*r;o.minutes+=m;o.sessions++;o.gym++;o.rpeSum+=r;o.rpeN++;o.prs+=x.prs||0;x.exercises.forEach(e=>loggedSets(e).forEach(st=>{o.vol+=(st.w||0)*st.r;o.sets++}))}})}
  return o;
}
function muscleSets(w){const m={};for(let di=0;di<7;di++){const k=fmtKey(dateFor(w,di));daySessions(k).forEach(s=>{if(s.kind!=='gym')return;const x=S.sessions[s.id];if(!x?.done)return;x.exercises.forEach(e=>{const n=loggedSets(e).length;if(!n)return;const g=exOf(e.ex).m;m[g]=(m[g]||0)+n})})}return m}
const MG_RANGE={chest:[10,22],back:[10,25],shoulders:[8,24],biceps:[6,20],triceps:[6,18],legs:[8,20],glutes:[4,16],core:[6,20]};

/* ===================== PROGRESSION ===================== */
function sessionList(){const p=prog();return Object.values(S.sessions).filter(s=>s&&s.date&&s.pid===S.pid&&(!p||s.prog===p.id)).sort((a,b)=>a.date<b.date?-1:1)}
function loggedSets(e){return (e.sets||[]).filter(s=>s.ok&&s.r!=null&&s.r>0)}
function lastLog(exId,tplId,beforeDate){const arr=sessionList().filter(s=>s.done&&s.date<beforeDate&&(!tplId||s.tpl===tplId));for(let i=arr.length-1;i>=0;i--){const e=arr[i].exercises.find(x=>x.ex===exId&&loggedSets(x).length);if(e)return {sess:arr[i],e}}return null}
function nextFrom(e,base,inc){
  const sets=loggedSets(e); const nSets=base.sets; const tReps=e.tReps??base.reps; const tW=e.tW??Math.max(...sets.map(s=>s.w||0));
  const allHit=sets.length>=nSets&&sets.every(s=>s.r>=tReps); const hard=sets.some(s=>s.rpe!=null&&s.rpe>=9.5);
  const choice=e.progNext||e.prog||'auto';
  if(choice==='hold') return {w:tW,reps:tReps,sets:nSets,why:'repeat'};
  if(choice==='reps') return {w:inc===0?0:tW,reps:tReps+1,sets:nSets,why:'reps_up'};
  if(choice==='weight') return inc===0?{w:0,reps:tReps+1,sets:nSets,why:'reps_up'}:{w:round(tW+inc),reps:base.reps,sets:nSets,why:'weight_up'};
  if(inc===0){return allHit&&!hard?{w:0,reps:Math.min(tReps+1,base.reps+6),sets:nSets,why:'reps_up'}:{w:0,reps:tReps,sets:nSets,why:'repeat'}}
  if(base.reps<=6){return allHit&&!hard?{w:round(tW+inc),reps:base.reps,sets:nSets,why:'weight_up'}:{w:tW,reps:base.reps,sets:nSets,why:'repeat'}}
  const top=base.reps+2;
  if(allHit&&!hard){return tReps<top?{w:tW,reps:tReps+1,sets:nSets,why:'reps_up'}:{w:round(tW+inc),reps:base.reps,sets:nSets,why:'weight_up'}}
  return {w:tW,reps:tReps,sets:nSets,why:'repeat'};
}
function suggest(tplId,exId,base,date){
  const inc=exOf(exId).inc; let hit=lastLog(exId,tplId,date),foreign=false;
  if(!hit&&base.w==null){hit=lastLog(exId,null,date);foreign=true}
  if(!hit) return {w:base.w??null,reps:base.reps,sets:base.sets,why:'start'};
  if(foreign) return {w:Math.max(...loggedSets(hit.e).map(s=>s.w||0)),reps:base.reps,sets:base.sets,why:'start'};
  return nextFrom(hit.e,base,inc);
}
const round=x=>Math.round(x*100)/100; const e1rm=(w,r)=>r>=1?w*(1+r/30):0;
function bestBefore(exId,date){let bw=0,be=0;(settings().manualPrs||[]).filter(m=>m.ex===exId&&m.date<date).forEach(m=>{bw=Math.max(bw,m.w||0);be=Math.max(be,e1rm(m.w||0,m.r))});sessionList().filter(s=>s.done&&s.date<date).forEach(s=>s.exercises.filter(x=>x.ex===exId).forEach(x=>loggedSets(x).forEach(st=>{bw=Math.max(bw,st.w||0);be=Math.max(be,e1rm(st.w||0,st.r))})));return {bw,be}}
function buildSession(k,tplId,id,extra){
  const p=prog(); if(tplId===ADHOC) return {id,pid:S.pid,prog:p.id,date:k,tpl:ADHOC,extra:true,done:false,exercises:[]};
  const tpl=p.templates[tplId]; const swaps=((settings().swaps||{})[p.id]||{})[tplId]||{};
  const exercises=tpl.ex.map(([exId,sets,reps,w],i)=>{const useEx=swaps[i]||exId;const base=swaps[i]?{sets,reps,w:null}:{sets,reps,w:w??null};const sg=suggest(tplId,useEx,base,k);
    return {slot:i,ex:useEx,orig:exId,tSets:sg.sets,tReps:sg.reps,tW:sg.w,why:sg.why,baseReps:reps,baseSets:sets,baseW:w??null,note:'',prog:(tpl.ex[i][4]&&tpl.ex[i][4].prog)||'auto',rest:tpl.ex[i][4]?.rest??null,rir:tpl.ex[i][4]?.rir??null,sets:Array.from({length:sg.sets},()=>({w:null,r:null,rpe:null,ok:false}))}});
  return {id,pid:S.pid,prog:p.id,date:k,tpl:tplId,extra:!!extra,done:false,exercises};
}
function refreshTargets(sess){if(sess.done||sess.exercises.some(e=>e.sets.some(s=>s.ok||s.r!=null||s.w!=null||s.rpe!=null)))return;sess.exercises.forEach(e=>{const base={sets:e.baseSets,reps:e.baseReps,w:e.ex===e.orig?e.baseW:null};const sg=suggest(sess.tpl,e.ex,base,sess.date);e.tW=sg.w;e.tReps=sg.reps;e.why=sg.why;e.sets.forEach(s=>{if(!s.ok)s.w=null})})}
function countPrs(sess){let prs=0;sess.exercises.forEach(e=>{const b=bestBefore(e.ex,sess.date);const ls=loggedSets(e);if(!ls.length)return;const mw=Math.max(...ls.map(s=>s.w||0)),me=Math.max(...ls.map(s=>e1rm(s.w||0,s.r)));if((b.bw&&mw>b.bw)||(b.be&&me>b.be+0.5))prs++});return prs}
const ADHOC='adhoc';
function tplOf(id,sid){if(id===ADHOC){const x=sid?S.sessions[sid]:null;return {id:ADHOC,name:t('looseExercises'),ex:x?x.exercises.map(e=>[e.ex,e.tSets,e.tReps,e.tW]):[]}}return prog()?.templates[id]||null}

/* ---------- SHARE LINK CODEC ---------- */
const PUBLIC_URL='https://dannydevrijer.github.io/Fitness-App/';
const b64u=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=str=>{const b=atob(str.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((str.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function encodeShare(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));try{if(window.CompressionStream){const cs=new CompressionStream('gzip');const w=cs.writable.getWriter();w.write(raw);w.close();const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());return 'z'+b64u(buf)}}catch(e){}return 'j'+b64u(raw)}
async function decodeShare(code){const kind=code[0],body=code.slice(1);const bytes=unb64u(body);if(kind==='z'){const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(bytes);w.close();return JSON.parse(await new Response(ds.readable).text())}return JSON.parse(new TextDecoder().decode(bytes))}
function sharePayload(sd){const items=[];const by=S.profiles[S.pid]?.name||'';
  sd.sessions.forEach(sx=>{const tpl=tplOf(sx.tpl,sx.id);if(!tpl||!tpl.ex.length)return;items.push({kind:'workout',tpl:{name:tpl.name,ex:tpl.ex}})});
  sd.cardio.forEach(cs=>items.push({kind:'cardio',s:{type:cs.type,title:cs.title||'',lines:cs.lines||'',km:cs.km??null,rpe:cs.rpe??null,zone:cs.zone||null,choice:cs.choice||null}}));
  const used=new Set();items.forEach(it=>it.kind==='workout'&&it.tpl.ex.forEach(e=>used.add(e[0])));
  const customEx=(settings().customEx||[]).filter(x=>used.has(x.id)).map(x=>({id:x.id,n:x.n,m:x.m,e:x.e}));
  return {v:1,by,date:sd.k,items,customEx};}
async function shareLinkFor(sd){return PUBLIC_URL+'#w='+await encodeShare(sharePayload(sd))}
function shareText(sd){const p=prog();const lines=[`${t('sharedBy')} ${S.profiles[S.pid]?.name||''} · ${dateLabel(sd.d)}`];
  sd.cardio.forEach(cs=>{lines.push('',`${t(cs.type).toUpperCase()}${cs.title?' · '+cs.title:''}`,cs.lines||'',[cs.km!=null?num(cs.km,1)+' km':'',cs.rpe!=null?'RPE '+cs.rpe:'',cs.zone||''].filter(Boolean).join(' · '))});
  sd.sessions.forEach(sx=>{lines.push('',tplName(sx.tpl).toUpperCase());sx.exercises.forEach(e=>{const ex=exOf(e.ex);const ls=loggedSets(e);lines.push(ls.length?`${ex.n}: ${ls.map(x=>`${ex.inc===0?'BW':num(x.w,1)}×${x.r}`).join(', ')}`:`${ex.n}: ${e.tSets}×${e.tReps}${e.tW?' @ '+num(e.tW,1)+' kg':''}`)})});
  return lines.join('\n');}
function garminText(sd){const out=[];sd.cardio.forEach(cs=>{out.push(`${cardioTitle(cs)} (${t(cs.type)})`);(cs.lines||'').split('\n').forEach(l=>{if(l.trim())out.push('- '+l.trim())});if(cs.km)out.push(`Doel: ${num(cs.km,1)} km`)});
  sd.sessions.forEach(sx=>{out.push(tplName(sx.tpl));sx.exercises.forEach(e=>{const ex=exOf(e.ex);out.push(`- ${ex.n}: ${e.tSets} sets × ${e.tReps} reps${e.tW?' @ '+num(e.tW,1)+' kg':''}${e.rest?', rust '+e.rest+' s':''}`)})});return out.join('\n')}
async function nativeShare({title,text,url,blob,filename}){if(!navigator.share)return false;try{const data={title,text:url?text+'\n'+url:text};if(blob&&navigator.canShare){const f=new File([blob],filename,{type:blob.type});if(navigator.canShare({files:[f]}))data.files=[f]}await navigator.share(data);return true}catch(e){return e?.name==='AbortError'}}
function copyText(txt,msg){return (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast(msg||t('copied'))).catch(()=>openSheet(`<textarea class="in" style="min-height:200px;font-size:13px">${esc(txt)}</textarea>`))}

}

const PERIODS=['week','month','3m','6m','12m','all'];
function periodRange(shift=0){const days={week:7,month:30,'3m':91,'6m':182,'12m':365}[S.period];const to=days?addDays(today(),-days*shift):today();const from=days?addDays(to,-days+1):null;return [from?fmtKey(from):null,fmtKey(to)]}
function statsData(shift=0){ // all programs of this profile, within period

  const gym=Object.values(S.sessions).filter(x=>x&&x.pid===S.pid&&x.done&&inR(x.date)).sort((a,b)=>a.date<b.date?-1:1);
  const cardio=[];

    Object.entries(doc.s||{}).forEach(([idx,st])=>{if(!st.done)return;const def=defs[+idx];if(!def||def.kind!=='cardio')return;const km=st.dist??def.km??0;const minutes=st.time||({hyrox:60,other:45,race:80,bike:60,run:km?Math.round(km*5.5):45}[def.type]||45);cardio.push({date,type:def.type,disc:discOf(def),km,minutes,time:st.time||null,hr:st.hr||null,rpe:st.rpe??def.rpe??6,runType:def.runType||null,format:def.format||null,mov:def.mov||null,title:def.title||'',lines:def.lines||'',result:st.result||'',rounds:st.rounds||''})})});
  const manual=(settings().manualPrs||[]).filter(x=>inR(x.date));

}

function overviewTiles(){

}
function mgBar(k,n){const [lo,hi]=MG_RANGE[k];const st=n<lo?'low':n>hi?'high':'ok';const col={low:'var(--warn)',ok:'var(--accent)',high:'var(--danger)'}[st];const pct=Math.min(100,n/(hi*1.15)*100),loP=lo/(hi*1.15)*100,hiP=hi/(hi*1.15)*100;

function barChart(vals,labels){const W=340,H=140,px=6,py=18;const n=vals.length;const max=Math.max(...vals,1);const bw=(W-2*px)/n;return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${vals.map((v,i)=>{const h=(H-py-20)*v/max;const x=px+i*bw+bw*0.15;const y=H-20-h;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${i===n-1?'var(--accent)':'rgba(22,227,110,.35)'}"/><text x="${(x+bw*0.35).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--fg2)" font-family="inherit">${v?Math.round(v):''}</text><text x="${(x+bw*0.35).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--fg3)" font-family="inherit">${labels[i]}</text>`}).join('')}</svg>`}
function lineChart(vals,labels){const W=340,H=150,px=28,py=14;const n=vals.length;if(n<2)return `<div class="dim" style="font-size:12px;padding:8px 0">${n===1?`${num(vals[0],0)} kg`:t('noData')}</div>`;const min=Math.min(...vals)*0.95,max=Math.max(...vals)*1.03||1;const x=i=>px+(W-px-10)*(i/(n-1)),y=v=>py+(H-py*2)*(1-(v-min)/(max-min||1));const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);const area=`M${pts[0]} L${pts.join(' L')} L${x(n-1).toFixed(1)},${H-py} L${x(0).toFixed(1)},${H-py} Z`;

function shareRecap(w){

async function readImportFile(f){
  if(f.type.startsWith('image/')) return {name:f.name,kind:'image',blob:f};
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
    if(!window.pdfjsLib) throw new Error('PDF reader not loaded');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let text='';
    for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();let lastY=null,line='';tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>2){text+=line.trim()+'\n';line=''}line+=(line&&!line.endsWith(' ')?' ':'')+it.str;lastY=y});text+=line.trim()+'\n\n'}
    return {name:f.name,kind:'pdf',text};
  }
  return {name:f.name,kind:'text',text:await f.text()};
}

Regels:

  btn.disabled=false; render();
}

  if(s.disc==='wod'&&s.mov?.length){const head={amrap:`${s.dur||''} min AMRAP:`,emom:`${s.dur||''} min EMOM:`,fortime:'For time:',rounds:`${s.rounds||''} rounds:`,intervals:`${s.rounds||''} intervals:`,circuit:`${s.rounds||''} rounds circuit:`,custom:''}[s.format||'custom'];return [head,...s.mov.map(m=>`${m.qty||''}${m.unit==='reps'?'':' '+m.unit} ${m.n}${m.kg?' @ '+m.kg+' kg':''}`.trim())].filter(Boolean).join('\n')}

function latestPrs(n){const out=[];(settings().manualPrs||[]).forEach(m=>out.push({date:m.date,name:m.ex?exOf(m.ex).n:m.name,value:m.ex?`${num(m.w,1)} kg × ${m.r}`:m.value}));

/* ===================== RECOMMENDATIONS (rule-based) ===================== */
function recommendations(){
  const out=[]; const p=prog(); if(!p) return out; const k=fmtKey(today()); const d=statsDataAll(); const tk=today();
  const daysAgo=date=>Math.round((tk-parseKey(date))/864e5);
  // 1. exercise ready for more weight: last 3 sessions all reps hit, same weight, prog auto
  const byEx={}; d.gym.sort((a,b)=>a.date<b.date?-1:1).forEach(s=>s.exercises.forEach(e=>{const ls=loggedSets(e);if(!ls.length)return;(byEx[e.ex]=byEx[e.ex]||[]).push({date:s.date,hit:ls.length>=(e.tSets||ls.length)&&ls.every(x=>x.r>=(e.tReps||0)),w:Math.max(...ls.map(x=>x.w||0))})}));
  Object.entries(byEx).forEach(([ex,arr])=>{const last=arr.slice(-3);const x=exOf(ex);if(last.length===3&&last.every(a=>a.hit)&&last.every(a=>a.w===last[0].w)&&x.inc>0&&out.length<4)out.push({icon:'📈',text:t('recWeight').replace('{ex}',x.n).replace('{kg}',num(last[0].w+x.inc,1)),action:'stats:ex',label:t('view')})});
  // 2. two hard days in a row + hard planned today
  const hardRecent=d.cardio.filter(c=>daysAgo(c.date)<=2&&c.rpe>=8).length+d.gym.filter(s=>daysAgo(s.date)<=2&&gymRpe(s)>=8.5).length;
  const todayHard=daySessions(k).some(s=>s.kind==='cardio'&&(s.rpe||0)>=8&&!isDone(k,s));
  if(hardRecent>=2&&todayHard) out.push({icon:'🧘',text:t('recRecover')});
  // 3. no interval in 4 weeks (only if runner)
  const runs=d.cardio.filter(c=>c.disc==='run'); if(runs.length>=4){const lastIv=runs.filter(c=>/interval|tempo|threshold|fartlek/i.test(c.runType||c.title||c.lines||'')).sort((a,b)=>a.date<b.date?1:-1)[0];if(!lastIv||daysAgo(lastIv.date)>28)out.push({icon:'⚡',text:t('recInterval'),action:'addrun:interval',label:t('plan')})}
  // 4. long gap strength / run
  const lastGym=d.gym.sort((a,b)=>a.date<b.date?1:-1)[0]; if(lastGym&&daysAgo(lastGym.date)>=7) out.push({icon:'🏋️',text:t('recGym').replace('{d}',daysAgo(lastGym.date))});
  const lastRun=runs.sort((a,b)=>a.date<b.date?1:-1)[0]; if(lastRun&&daysAgo(lastRun.date)>=10) out.push({icon:'🏃',text:t('recRun').replace('{d}',daysAgo(lastRun.date))});
  // 5. race taper
  if(p.race){const dr=Math.round((parseKey(p.race)-tk)/864e5);if(dr>=0&&dr<=14)out.push({icon:'🏁',text:t('recTaper').replace('{d}',dr)})}
  // 6. bodyweight
  const bl=bwLog(); if(bl.length&&daysAgo(bl[bl.length-1].date)>=14) out.push({icon:'⚖️',text:t('recBw'),action:'prefs',label:t('logToday')});
  // 7. streak praise
  const wl=planFor(tk)?weekLoad(planFor(tk).w):null; if(wl&&wl.planned&&wl.done===wl.planned) out.push({icon:'🔥',text:t('recWeekDone')});
  return out.slice(0,4);
}

  const ag=main.querySelector('[data-addgym]'); if(ag) ag.onclick=()=>openTemplateEditor(null,id=>{const k=fmtKey(today());const d=JSON.parse(JSON.stringify(dayDoc(k)));d.date=k;d.extra=[...(d.extra||[]),id];persist('days',dayKey(k),d,0);S.view='today';S.date=k;render()});
}
function recentList(items){if(!items.length)return `<div class="card flat muted">${t('noData')}</div>`;return `<div class="card"><div class="eyebrow" style="margin-bottom:4px">${t('recent')}</div><div class="hist">${items.map(r=>`<div class="r"><span><b>${esc(r.title)}</b> <span class="dim">· ${dShort(r.date)}</span></span><span class="dim" style="text-align:right">${esc(r.sub)}</span></div>`).join('')}</div></div>`}

/* ===================== ONBOARDING WIZARD ===================== */
function buildRunPlan(start,days=3,nWeeks=8){
  const mk=(rt,title,km,rpe,iv)=>({kind:'cardio',type:'run',disc:'run',runType:rt,title,km,rpe,zone:rt==='easy'||rt==='recovery'?'Z2':rt==='long'?'Z2':'Z4',iv:iv||null,lines:'',choice:null});
  const sessions=[mk('easy','Rustige duurloop',6,4),mk('interval','Intervaltraining',8,8,{wu:10,n:6,work:'400 m',rec:'200 m',pace:''}),mk('long','Lange duurloop',12,5),mk('tempo','Tempoloop',8,7,{wu:10,n:1,work:'20 min tempo',rec:'',pace:''}),mk('recovery','Herstelrun',5,3)].slice(0,days);
  sessions.forEach(s=>s.lines=genLines(s)||`${s.km} km ${t('rt.'+s.runType).toLowerCase()}`);
  const slots=[['tue'],['tue','thu'],['tue','thu','sun'],['mon','wed','fri','sun'],['mon','tue','thu','sat','sun']][Math.min(5,Math.max(1,days))-1];
  const weeks=Array.from({length:nWeeks},(_,wi)=>{const d={mon:[],tue:[],wed:[],thu:[],fri:[],sat:[],sun:[]};slots.forEach((dk,i)=>{const s=JSON.parse(JSON.stringify(sessions[i%sessions.length]));if(s.runType==='long')s.km=Math.round(s.km*(1+wi*0.1));d[dk].push(s)});return {days:d}});
  return {name:'Hardlopen '+days+'×/week',start,race:null,weeks,templates:{},cardioLib:sessions};
}
function buildUpperLower(start,nWeeks=8){const templates={upper1:{id:'upper1',name:'Upper A',ex:[['bench',4,6,null],['row_bb',4,8,null],['ohp',3,8,null],['lat_wide',3,10,null],['curl_db',3,12,null],['tri_pushdown',3,12,null]]},lower1:{id:'lower1',name:'Lower A',ex:[['squat',4,6,null],['rdl',3,8,null],['leg_press',3,12,null],['leg_curl',3,12,null],['calf_raise',4,15,null],['hlr',3,12,0]]},upper2:{id:'upper2',name:'Upper B',ex:[['inc_db',4,8,null],['pull_up',4,6,0],['db_shoulder',3,10,null],['row_cable',3,12,null],['lat_raise',3,15,null],['curl_bb',3,10,null]]},lower2:{id:'lower2',name:'Lower B',ex:[['deadlift',4,5,null],['bulgarian',3,10,null],['leg_ext',3,12,null],['hip_thrust',3,10,null],['calf_seated',4,15,null],['ab_crunch_mc',3,15,null]]}};
  return {name:'Upper / Lower',start,race:null,weeks:Array.from({length:nWeeks},()=>({days:{mon:[{kind:'gym',tpl:'upper1'}],tue:[{kind:'gym',tpl:'lower1'}],wed:[],thu:[{kind:'gym',tpl:'upper2'}],fri:[{kind:'gym',tpl:'lower2'}],sat:[],sun:[]}})),templates}}
function buildHybrid(start,days=4,nWeeks=8){
  const p=buildPPL(start,nWeeks); const run=buildRunPlan(start,2,nWeeks); const wod={kind:'cardio',type:'hyrox',disc:'wod',format:'rounds',rounds:4,dur:null,mov:[{n:'Run',qty:1000,unit:'m',kg:null},{n:'Wall Balls',qty:25,unit:'reps',kg:6},{n:'Sled Push',qty:20,unit:'m',kg:null},{n:'Burpee Broad Jumps',qty:20,unit:'m',kg:null}],title:'HYROX Conditioning',km:4,rpe:8,zone:'Z4',lines:'',choice:null};wod.lines=genLines(wod);
  const plan={3:[['mon','gym','push'],['wed','run',0],['sat','wod']],4:[['mon','gym','push'],['tue','run',0],['thu','gym','pull'],['sat','wod']],5:[['mon','gym','push'],['tue','run',0],['wed','gym','legs'],['fri','run',1],['sat','wod']],6:[['mon','gym','push'],['tue','run',0],['wed','gym','pull'],['thu','run',1],['fri','gym','legs'],['sat','wod']]}[Math.min(6,Math.max(3,days))];
  const weeks=Array.from({length:nWeeks},()=>{const d={mon:[],tue:[],wed:[],thu:[],fri:[],sat:[],sun:[]};plan.forEach(([dk,kind,x])=>{if(kind==='gym')d[dk].push({kind:'gym',tpl:x});else if(kind==='run')d[dk].push(JSON.parse(JSON.stringify(run.cardioLib[x])));else d[dk].push(JSON.parse(JSON.stringify(wod)))});return {days:d}});
  return {name:'Hybride '+days+'×/week',start,race:null,weeks,templates:p.templates,cardioLib:[...run.cardioLib,wod]};
}
function recommendTemplates(goal,discs,days){
  const mon=fmtKey(addDays(today(),-dayIdx(today()))); const out=[];
  if(goal==='hyrox'||discs.includes('hyrox')&&discs.length===1){out.push({name:'10 weken Hyrox + kracht (Danny)',desc:t('tplHyroxDanny'),build:s=>buildHyrox(s,'danny'),start:'2026-09-21'});out.push({name:'10 weken Hyrox',desc:t('tplHyrox'),build:s=>buildHyrox(s,'original'),start:'2026-09-21'})}
  if(goal==='strength'||goal==='muscle'||(discs.length===1&&discs[0]==='gym')){if(days>=4)out.push({name:'Upper / Lower',desc:t('tplUL'),build:buildUpperLower,start:mon});out.push({name:'Push / Pull / Legs',desc:t('tplPPL'),build:s=>buildPPL(s,8),start:mon})}
  if(goal==='run'||(discs.length===1&&discs[0]==='run')){out.push({name:`Hardlopen ${Math.min(5,days)}×/week`,desc:t('tplRun'),build:s=>buildRunPlan(s,Math.min(5,days)),start:mon})}
  if(goal==='fit'||goal==='endurance'||discs.length>1||!out.length){out.push({name:`Hybride ${Math.min(6,Math.max(3,days))}×/week`,desc:t('tplHybrid'),build:s=>buildHybrid(s,Math.min(6,Math.max(3,days))),start:mon})}
  return out.slice(0,3);
}
function openOnboarding(){
  let step=1,goal=null,discs=[],days=4;
  const goals=[['strength',t('goalStrength'),'🏋️'],['run',t('goalRun'),'🏃'],['hyrox',t('goalHyrox'),'🔥'],['endurance',t('goalEndurance'),'❤️'],['muscle',t('goalMuscle'),'💪'],['fit',t('goalFit'),'✨']];
  const body=()=>{
    if(step===1) return `<div class="eyebrow">${t('step')} 1/4</div><b style="font-size:20px">${t('obGoal')}</b><div class="lib">${goals.map(([id,l,ic])=>`<button data-goal="${id}" class="${goal===id?'cur':''}"><span class="row" style="gap:10px"><span style="font-size:20px">${ic}</span><b>${l}</b></span></button>`).join('')}</div><button class="btn primary block" data-next ${goal?'':'disabled'}>${t('next')} ${ICONS.right}</button>`;
    if(step===2) return `<div class="eyebrow">${t('step')} 2/4</div><b style="font-size:20px">${t('obDiscs')}</b><div class="lib">${[['run','🏃 '+t('discRun')],['gym','🏋️ '+t('discGym')],['hyrox','🔥 '+t('discWod')]].map(([id,l])=>`<button data-disc="${id}" class="${discs.includes(id)?'cur':''}"><b>${l}</b>${discs.includes(id)?ICONS.check.replace('<svg','<svg class="icon" style="color:var(--accent)"'):''}</button>`).join('')}</div><div class="row"><button class="btn grow" data-prev>${t('back')}</button><button class="btn primary grow" data-next ${discs.length?'':'disabled'}>${t('next')} ${ICONS.right}</button></div>`;
    if(step===3) return `<div class="eyebrow">${t('step')} 3/4</div><b style="font-size:20px">${t('obDays')}</b><div class="seg">${[2,3,4,5,6].map(n=>`<button data-days="${n}" class="${days===n?'on':''}">${n}</button>`).join('')}</div><div class="dim" style="font-size:13px">${t('obDaysHint')}</div><div class="row"><button class="btn grow" data-prev>${t('back')}</button><button class="btn primary grow" data-next>${t('next')} ${ICONS.right}</button></div>`;
    const recs=recommendTemplates(goal,discs,days);
    return `<div class="eyebrow">${t('step')} 4/4</div><b style="font-size:20px">${t('obRec')}</b><div class="muted" style="font-size:13px">${t('obRecHint')}</div><div class="lib">${recs.map((r,i)=>`<button data-pick="${i}" class="${i===0?'cur':''}"><span><b>${esc(r.name)}</b><div class="m">${esc(r.desc)}</div></span>${ICONS.right}</button>`).join('')}</div><div class="row"><button class="btn grow" data-prev>${t('back')}</button><button class="btn grow" data-skip>${t('obSkip')}</button></div>`;
  };
  const bind=sh=>{const rr=()=>{sh.querySelector('.body').innerHTML=body();bind(sh)};
    sh.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{goal=b.dataset.goal;if(goal==='run'&&!discs.length)discs=['run'];if(goal==='hyrox'&&!discs.length)discs=['hyrox','gym','run'];if((goal==='strength'||goal==='muscle')&&!discs.length)discs=['gym'];rr()});
    sh.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>{const id=b.dataset.disc;discs=discs.includes(id)?discs.filter(x=>x!==id):[...discs,id];rr()});
    sh.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=+b.dataset.days;rr()});
    const nx=sh.querySelector('[data-next]'); if(nx) nx.onclick=()=>{step++;rr()}; const pv=sh.querySelector('[data-prev]'); if(pv) pv.onclick=()=>{step--;rr()};
    sh.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const r=recommendTemplates(goal,discs,days)[+b.dataset.pick];const p=r.build(r.start);p.name=p.name||r.name;saveProgram(p,true);persist('settings',S.pid,Object.assign(JSON.parse(JSON.stringify(settings())),{goal,discs,daysPerWeek:days}),0);closeSheet();S.view='home';render();toast(t('saved'))});
    const sk=sh.querySelector('[data-skip]'); if(sk) sk.onclick=()=>{closeSheet();openNewBlock()};
  };
  openSheet(body(),bind);
}

/* ===================== INTERVALS.ICU (Garmin route) ===================== */
async function sendToIntervals(k,s){
  const st=settings(); if(!st.icuKey||!st.icuId){toast(t('icuMissing'));S.moreTab='prefs';S.view='settings';render();return}
  const body={category:'WORKOUT',start_date_local:k+'T00:00:00',type:s.type==='bike'?'Ride':s.kind==='gym'?'WeightTraining':'Run',name:s.kind==='gym'?tplName(s.tpl):cardioTitle(s),description:s.kind==='gym'?garminText({cardio:[],sessions:[S.sessions[s.id]].filter(Boolean)}):garminText({cardio:[{...s,st:{}}],sessions:[]})};
  try{const r=await fetch(`https://intervals.icu/api/v1/athlete/${encodeURIComponent(st.icuId)}/events`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Basic '+btoa('API_KEY:'+st.icuKey)},body:JSON.stringify(body)});if(!r.ok)throw new Error('HTTP '+r.status);toast(t('icuSent'))}catch(e){toast(`${t('icuFailed')} (${e?.message||e})`)}
}

/* ---------- SHEET & TOAST ---------- */
function openSheet(inner,bind){const el=$('#sheet');el.innerHTML=`<div class="sheet-bg"><div class="sheet"><div class="grab"></div><button class="x" data-closesheet aria-label="${t('close')}"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="body">${inner}</div></div></div>`;
  const bg=el.querySelector('.sheet-bg');bg.onclick=e=>{if(e.target===e.currentTarget)closeSheet()};bg.addEventListener('touchmove',e=>{if(e.target===bg)e.preventDefault()},{passive:false});
  el.querySelector('[data-closesheet]').onclick=closeSheet;el.querySelector('.grab').onclick=closeSheet;document.body.classList.add('sheet-open');if(bind)bind(el.querySelector('.sheet'))}
function closeSheet(){$('#sheet').innerHTML='';document.body.classList.remove('sheet-open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let toastT; function toast(msg){const el=$('#toast');el.textContent=msg;el.className='toast';el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}

/* ---------- IMPORT FROM SHARE LINK ---------- */
async function checkShareHash(){
  const m=location.hash.match(/^#w=([A-Za-z0-9_-]+)$/); if(!m) return; let pl; try{pl=await decodeShare(m[1])}catch(e){return}
  history.replaceState(null,'',location.pathname+location.search);
  if(!pl||!Array.isArray(pl.items)||!pl.items.length) return;
  const show=()=>{if(!S.pid||!Object.keys(S.profiles).length){setTimeout(show,800);return}
    openSheet(`<div class="eyebrow">${t('sharedBy')} ${esc(pl.by||'?')}${pl.date?' · '+dShort(pl.date):''}</div>
      <div class="stack" style="gap:8px">${pl.items.map(it=>it.kind==='workout'?`<div class="card" style="padding:10px 12px"><div class="row between"><b>${esc(it.tpl.name)}</b><span class="chip gym">${t('gym')}</span></div><div class="dim" style="font-size:12px">${it.tpl.ex.map(e=>`${esc((pl.customEx||[]).find(c=>c.id===e[0])?.n||exOf(e[0]).n)} ${e[1]}×${e[2]}${e[3]?' @'+e[3]:''}`).join(' · ')}</div></div>`:`<div class="card" style="padding:10px 12px"><div class="row between"><b>${esc(it.s.title||t(it.s.type))}</b><span class="chip ${it.s.type}">${t(it.s.type)}</span></div><div class="dim" style="font-size:12px;white-space:pre-line">${esc(it.s.lines)}</div></div>`).join('')}</div>
      <div class="row"><button class="btn grow" data-no>${t('cancel')}</button><button class="btn primary grow" data-imp>${t('importWorkout')}</button></div>`,sh=>{
      sh.querySelector('[data-no]').onclick=closeSheet;
      sh.querySelector('[data-imp]').onclick=()=>{
        let p=prog(); if(!p){p={id:uid(),pid:S.pid,name:t('workouts'),start:fmtKey(addDays(today(),-dayIdx(today()))),race:null,weeks:[{days:{mon:[],tue:[],wed:[],thu:[],fri:[],sat:[],sun:[]}}],templates:{},created:Date.now()};saveProgram(p,true)}
        const st=JSON.parse(JSON.stringify(settings())); (pl.customEx||[]).forEach(x=>{if(!(st.customEx||[]).some(c=>c.id===x.id))st.customEx=[...(st.customEx||[]),{...x,pid:S.pid}]}); persist('settings',S.pid,st,0);
        const k=fmtKey(today()); const d=JSON.parse(JSON.stringify(dayDoc(k))); d.date=k; d.extra=d.extra||[];
        pl.items.forEach(it=>{if(it.kind==='workout'){const tid='w_'+uid();p.templates[tid]={id:tid,name:it.tpl.name,ex:it.tpl.ex};d.extra.push(tid)}else{p.cardioLib=p.cardioLib||[];p.cardioLib.push(it.s);d.extra.push({kind:'cardio',...it.s})}});
        persist('programs',progKey(S.pid,p.id),p,0); persist('days',dayKey(k),d,0); closeSheet(); S.view='today'; S.date=k; render(); toast(`${t('importedTo')} ${t('today').toLowerCase()} · ${esc(p.name)}`)};
    })};
  show();
}

loadLocal(); S.date=fmtKey(today()); migrateOld(); ensureProfile(); render(); initDb(); initDl(); initAi(); checkShareHash();
