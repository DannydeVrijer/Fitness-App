<title>Hyrox Trainingslog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen mobile app. Sticky header, scrolling content, fixed bottom tab bar. Whoop-like: black ground, one green accent, big tabular numbers, thin hairlines. Dark by choice. */
:root{
  --bg:#0a0c0f; --surface:#13171c; --surface2:#1b2027; --line:#252c35; --line2:#323b46;
  --fg:#eef2f5; --fg2:#9aa5b1; --fg3:#5d6875;
  --accent:#16e36e; --accent-ink:#052a15; --accent-dim:rgba(22,227,110,.14);
  --warn:#ffb340; --danger:#ff5c5c; --blue:#4da3ff; --purple:#a78bfa;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.muted{color:var(--fg2)}.dim{color:var(--fg3)}
.num{font-weight:800;letter-spacing:-.02em}

#app{display:flex;flex-direction:column;height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,12,15,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
header.top .title{font-size:17px;font-weight:800;letter-spacing:-.01em}
header.top .sub{font-size:12px;color:var(--fg2)}
main{flex:1;overflow-y:auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,15,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--fg3);font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--surface2);color:var(--fg2);white-space:nowrap}
.chip.hyrox{background:rgba(22,227,110,.14);color:var(--accent)}
.chip.run{background:rgba(77,163,255,.14);color:var(--blue)}
.chip.gym{background:rgba(167,139,250,.16);color:var(--purple)}
.chip.bike{background:rgba(255,179,64,.14);color:var(--warn)}
.chip.other{background:var(--surface2);color:var(--fg2)}
.chip.race{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line2);min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--fg2)}
.iconbtn:active{background:var(--surface2)}

/* day header */
.dayhead{display:flex;align-items:center;gap:12px}
.dayhead .ring{width:64px;height:64px;flex:none;position:relative}
.dayhead .ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.dayhead .ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .d{font-size:22px;font-weight:800;letter-spacing:-.02em}
.daynav .w{font-size:12px;color:var(--fg2)}

/* session card */
.sess{display:flex;flex-direction:column;gap:12px}
.sess .lines{white-space:pre-line;color:var(--fg2);font-size:14px;line-height:1.5}
.sess.done{border-color:rgba(22,227,110,.35)}
.targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.t{background:var(--surface2);border-radius:var(--r-sm);padding:8px 10px}
.t .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.t .v{font-size:18px;font-weight:800;letter-spacing:-.02em}
.t .v small{font-size:11px;font-weight:600;color:var(--fg2);margin-left:2px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:700}
input.in,select.in,textarea.in{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;font-weight:600}
textarea.in{min-height:64px;resize:vertical;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--fg2);min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* workout */
.ex{display:flex;flex-direction:column;gap:10px}
.ex .name{font-size:16px;font-weight:800;letter-spacing:-.01em}
.ex .meta{font-size:12px;color:var(--fg2)}
.sugg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--accent-dim);color:var(--accent)}
.sugg.hold{background:var(--surface2);color:var(--fg2)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr 40px;gap:6px;align-items:center}
.sets .h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:700;text-align:center}
.sets .n{font-size:12px;color:var(--fg3);text-align:center;font-weight:700}
.sets input{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:0 6px;height:44px;font-size:17px;font-weight:700;text-align:center}
.sets input.prev{color:var(--fg3);font-weight:600}
.sets input:focus{border-color:var(--accent)}
.sets .ok{width:40px;height:44px;border-radius:10px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:var(--fg3)}
.sets .ok.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sets .ok svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.prevline{font-size:12px;color:var(--fg3)}
.prevline b{color:var(--fg2);font-weight:700}
.exactions{display:flex;gap:8px;flex-wrap:wrap}
.exactions .btn{flex:1}
.pr{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--accent)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line2);width:100%;max-height:85%;display:flex;flex-direction:column;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet .body{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.lib{display:flex;flex-direction:column;gap:4px}
.lib button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:10px;text-align:left;border:1px solid transparent}
.lib button:active{background:var(--surface2)}
.lib button.cur{border-color:var(--accent)}
.lib .m{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{white-space:nowrap;padding:7px 11px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--fg2)}
.filters button.on{background:var(--accent);color:var(--accent-ink)}

/* schema */
.week{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week>button.wh{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);text-align:left}
.week.cur>button.wh{border-left:3px solid var(--accent)}
.week .days{border-top:1px solid var(--line)}
.week .dr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.week .dr:last-child{border-bottom:0}
.week .dr .dn{width:34px;font-size:11px;font-weight:800;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em}
.week .dr .dd{width:40px;font-size:12px;color:var(--fg2)}
.week .dr.today .dn{color:var(--accent)}
.dots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.dot.on{background:var(--accent)}.dot.half{background:var(--warn)}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.tile .v small{font-size:12px;color:var(--fg2);font-weight:600;margin-left:3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2);display:block}
.heat i.on{background:var(--accent)}.heat i.half{background:rgba(22,227,110,.4)}.heat i.miss{background:rgba(255,92,92,.35)}.heat i.today{outline:2px solid var(--fg);outline-offset:-2px}
.chart{width:100%;height:150px;display:block}
.hist{display:flex;flex-direction:column}
.hist .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist .r:last-child{border-bottom:0}
.exlist button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.exlist button:last-child{border-bottom:0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;z-index:30;font-weight:600;font-size:14px;text-align:center}
.sync{font-size:11px;color:var(--fg3);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg3);display:inline-block}
.sync.ok i{background:var(--accent)}.sync.local i{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,background .15s}}
</style>

</div>
<div id="sheet"></div>

// one write at a time per document, debounced
const pending = {}; const timers = {};
function persist(coll,id,data,delay=500){
  if(coll==='days') S.days[id]=data; else if(coll==='sessions') S.sessions[id]=data; else if(coll==='settings') S.settings=data;
  saveLocal();
  if(!S.db) return;
  clearTimeout(timers[coll+'/'+id]);
  timers[coll+'/'+id]=setTimeout(()=>flush(coll,id),delay);
}
const inflight = {};
async function flush(coll,id){
  const key=coll+'/'+id;
  if(inflight[key]){pending[key]=true;return}
  inflight[key]=true;
  try{
    const data = coll==='days'?S.days[id]:coll==='sessions'?S.sessions[id]:S.settings;
    if(data===undefined||data===null) await S.db.doc(key).delete(); else await S.db.doc(key).set(JSON.parse(JSON.stringify(data)));
    setSync('ok');
  }catch(e){setSync('local');}
  inflight[key]=false;
  if(pending[key]){pending[key]=false;flush(coll,id)}
}
function removeDoc(coll,id){ if(coll==='days') delete S.days[id]; else delete S.sessions[id]; saveLocal(); if(S.db){S.db.doc(coll+'/'+id).delete().catch(()=>{})} }
function setSync(state){S.storage=state;const el=document.getElementById('sync');el.className='sync '+state;el.querySelector('span').textContent=state==='ok'?'cloud':state==='local'?'local':'…';}

async function initDb(){
  try{
    const db = await window.claude?.use?.('db');
    if(!db){setSync('local');return}
    S.db=db;
    const [ds,ss,st] = await Promise.all([db.collection('days').get(),db.collection('sessions').get(),db.doc('settings/main').get()]);
    ds.docs.forEach(d=>{if(d.exists)S.days[d.id]=d.data()});
    ss.docs.forEach(d=>{if(d.exists)S.sessions[d.id]=d.data()});
    if(st.exists){S.settings=Object.assign({bodyweight:null,swaps:{}},st.data());if(S.settings.lang)S.lang=S.settings.lang;}
    saveLocal(); setSync('ok'); render();
  }catch(e){setSync('local')}
}

/* ===================== PROGRAM HELPERS ===================== */
function weekOf(d){return Math.floor((d-START)/864e5/7)+1}
function dayIdx(d){return (d.getDay()+6)%7}
function dateFor(w,di){return addDays(START,(w-1)*7+di)}
function planFor(d){
  const w=weekOf(d), di=dayIdx(d), dk=DAYS[di];
  if(w<1||w>10) return null;
  const prog = PROGRAM[w-1][dk]||null;
  const gym = (w<=9 && GYM_DAYS[dk]) ? GYM_DAYS[dk] : null;
  return {w,dk,prog,gym};
}
function dayDoc(k){return S.days[k]||{}}
function sessionsOn(k){
  const p=planFor(parseKey(k)); const list=[];
  if(p?.gym) list.push({tpl:p.gym,id:k+'_'+p.gym,extra:false});
  (dayDoc(k).extra||[]).forEach((tpl,i)=>list.push({tpl,id:k+'_'+tpl+'_x'+i,extra:true,xi:i}));
  return list;
}
function dayStatus(k){
  const d=parseKey(k), p=planFor(d); if(!p) return {total:0,done:0};
  let total=0,done=0;
  if(p.prog){total++; if(dayDoc(k).done) done++}
  sessionsOn(k).forEach(s=>{total++; if(S.sessions[s.id]?.done) done++});
  return {total,done};
}

/* ===================== PROGRESSION ===================== */
function sessionList(){return Object.values(S.sessions).filter(s=>s&&s.date).sort((a,b)=>a.date<b.date?-1:1)}
function loggedSets(e){return (e.sets||[]).filter(s=>s.ok&&s.r!=null&&s.r>0)}
function lastLog(exId,tplId,beforeDate){
  const arr=sessionList().filter(s=>s.done&&s.date<beforeDate&&(!tplId||s.tpl===tplId));
  for(let i=arr.length-1;i>=0;i--){const e=arr[i].exercises.find(x=>x.ex===exId&&loggedSets(x).length);if(e)return {sess:arr[i],e}}
  return null;
}
function suggest(tplId,exId,base,date){
  const ex=EX[exId]; const inc=ex.inc;
  let hit=lastLog(exId,tplId,date), foreign=false;
  if(!hit&&base.w==null){hit=lastLog(exId,null,date);foreign=true}
  if(!hit){ return base.w!=null?{w:base.w,reps:base.reps,sets:base.sets,why:'start'}:{w:null,reps:base.reps,sets:base.sets,why:'start'} }
  const {e}=hit; const sets=loggedSets(e);
  const nSets=base.sets;
  if(foreign){ return {w:Math.max(...sets.map(s=>s.w||0)),reps:base.reps,sets:nSets,why:'start'} }
  const tReps=e.tReps??base.reps; const tW=e.tW??Math.max(...sets.map(s=>s.w||0));
  const allHit = sets.length>=nSets && sets.every(s=>s.r>=tReps);
  const hard = sets.some(s=>s.rpe!=null&&s.rpe>=9.5);
  const lowRep = base.reps<=6;
  if(inc===0){ // bodyweight: reps only
    if(allHit&&!hard) return {w:0,reps:Math.min(tReps+1,base.reps+6),sets:nSets,why:'reps_up'};
    return {w:0,reps:tReps,sets:nSets,why:'repeat'};
  }
  if(lowRep){
    if(allHit&&!hard) return {w:round(tW+inc),reps:base.reps,sets:nSets,why:'weight_up'};
    return {w:tW,reps:base.reps,sets:nSets,why:'repeat'};
  }
  const top=base.reps+2;
  if(allHit&&!hard){
    if(tReps<top) return {w:tW,reps:tReps+1,sets:nSets,why:'reps_up'};
    return {w:round(tW+inc),reps:base.reps,sets:nSets,why:'weight_up'};
  }
  return {w:tW,reps:tReps,sets:nSets,why:'repeat'};
}
const round=x=>Math.round(x*100)/100;
const e1rm=(w,r)=>r>=1?w*(1+r/30):0;
function bestBefore(exId,date){ // best e1RM & weight before date
  let bw=0,be=0;
  sessionList().filter(s=>s.done&&s.date<date).forEach(s=>s.exercises.filter(x=>x.ex===exId).forEach(x=>loggedSets(x).forEach(st=>{bw=Math.max(bw,st.w||0);be=Math.max(be,e1rm(st.w||0,st.r))})));
  return {bw,be};
}
function buildSession(k,tpl,id,extra){
  const swaps=(S.settings.swaps||{})[tpl]||{};
  const exercises=TPL[tpl].ex.map(([exId,sets,reps,w],i)=>{
    const useEx=swaps[i]||exId; const base=swaps[i]?{sets,reps,w:null}:{sets,reps,w};
    const sg=suggest(tpl,useEx,base,k);
    return {slot:i,ex:useEx,orig:exId,tSets:sg.sets,tReps:sg.reps,tW:sg.w,why:sg.why,baseReps:reps,baseSets:sets,baseW:w,note:'',
      sets:Array.from({length:sg.sets},()=>({w:sg.w,r:null,rpe:null,ok:false}))};
  });
  return {id,date:k,tpl,extra:!!extra,done:false,exercises};
}

      <div class="grid2">

/* ---------- EXERCISE CARDS ---------- */
function exCardHtml(sess,e,i){
  const ex=EX[e.ex]; const prev=lastLog(e.ex,null,sess.date);
  const prevTxt=prev?loggedSets(prev.e).map(s=>`${num(s.w,1)}×${s.r}`).join(' · '):t('none');
  const best=bestBefore(e.ex,sess.date);
  const tgt=`${e.tSets} × ${e.tReps}${e.tW?` @ ${num(e.tW,2)} kg`:''}`;
  const why=e.why||'start';
  return `<div class="card ex" data-i="${i}" data-sid="${sess.id}">
    <div class="row between"><div class="stack grow" style="gap:1px"><div class="name">${esc(ex.n)}</div><div class="meta">${t('mg.'+ex.m)}${e.ex!==e.orig?` · <span style="color:var(--purple)">${ICONS.swap.replace('class="icon"','class="icon" style="width:12px;height:12px;vertical-align:-2px"')} ${esc(EX[e.orig].n)}</span>`:''}</div></div>
      <span class="sugg ${why==='repeat'||why==='start'?'hold':''}">${why==='weight_up'||why==='reps_up'?ICONS.up:''}${t('suggest.'+why)}</span></div>
    <div class="prevline">${t('target')}: <b>${tgt}</b></div>
    <div class="prevline">${t('prev')}: <b>${prevTxt}</b>${best.be?` · ${t('e1rm')} ${num(best.be,0)}`:''}</div>
    <div class="sets">
      <div class="h">#</div><div class="h">${t('kg')}</div><div class="h">${t('reps')}</div><div class="h">${t('rpe')}</div><div></div>
      ${e.sets.map((s,j)=>`<div class="n">${j+1}</div>
        <input type="number" inputmode="decimal" step="0.5" data-f="w" data-j="${j}" value="${s.w??''}" placeholder="${e.tW??''}" ${sess.done?'readonly':''}>
        <input type="number" inputmode="numeric" data-f="r" data-j="${j}" value="${s.r??''}" placeholder="${e.tReps}" ${sess.done?'readonly':''}>
        <input type="number" inputmode="decimal" step="0.5" min="1" max="10" data-f="rpe" data-j="${j}" value="${s.rpe??''}" placeholder="8" ${sess.done?'readonly':''}>
        <button class="ok ${s.ok?'on':''}" data-ok="${j}" aria-label="ok">${ICONS.check}</button>`).join('')}
    </div>
    <div class="exactions">
      ${sess.done?'':`<button class="btn sm" data-addset>+ ${t('set')}</button><button class="btn sm" data-swap>${ICONS.swap} ${t('swap')}</button>`}
      <button class="btn sm" data-note>${t('addNote')}</button>
    </div>
    <div class="field" ${e.note||e.noteOpen?'':'hidden'} data-notefield><textarea class="in" data-notein placeholder="${t('notePh')}" ${sess.done?'readonly':''}>${esc(e.note||'')}</textarea></div>
  </div>`;
}
function bindExCards(root,id){
  const sess=S.sessions[id];
  root.querySelectorAll(`.ex[data-sid="${id}"]`).forEach(card=>{
    const i=+card.dataset.i; const e=sess.exercises[i];
    card.querySelectorAll('input[data-f]').forEach(inp=>inp.oninput=()=>{const j=+inp.dataset.j;e.sets[j][inp.dataset.f]=inp.value===''?null:+inp.value;persist('sessions',id,sess,700)});
    card.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      if(sess.done)return; const j=+b.dataset.ok; const s=e.sets[j];
      if(!s.ok){ if(s.w==null) s.w=e.tW??(j>0?e.sets[j-1].w:null); if(s.r==null) s.r=e.tReps;
        card.querySelector(`input[data-f="w"][data-j="${j}"]`).value=s.w??''; card.querySelector(`input[data-f="r"][data-j="${j}"]`).value=s.r??''; }
      s.ok=!s.ok; b.classList.toggle('on',s.ok); persist('sessions',id,sess,300);
    });
    const add=card.querySelector('[data-addset]'); if(add) add.onclick=()=>{e.sets.push({w:e.sets[e.sets.length-1]?.w??e.tW,r:null,rpe:null,ok:false});persist('sessions',id,sess,0);render()};
    const sw=card.querySelector('[data-swap]'); if(sw) sw.onclick=()=>openSwap(id,i);
    card.querySelector('[data-note]').onclick=()=>{const f=card.querySelector('[data-notefield]');f.hidden=!f.hidden;e.noteOpen=!f.hidden;if(!f.hidden)f.querySelector('textarea').focus()};
    card.querySelector('[data-notein]').oninput=ev=>{e.note=ev.target.value;persist('sessions',id,sess,700)};
  });
  const act=root.querySelector(`[data-sessactions="${id}"]`); if(!act) return;
  const fin=act.querySelector('[data-finish]'); if(fin) fin.onclick=()=>{
    let prs=0; sess.exercises.forEach(e=>{const b=bestBefore(e.ex,sess.date);const ls=loggedSets(e);if(!ls.length)return;const mw=Math.max(...ls.map(s=>s.w||0)),me=Math.max(...ls.map(s=>e1rm(s.w||0,s.r)));if((b.bw&&mw>b.bw)||(b.be&&me>b.be+0.5))prs++});
    sess.done=true; sess.prs=prs; persist('sessions',id,sess,0);
    toast(prs?`${t('finished')} · ${prs} ${t('newPr')}`:t('finished')); render();
  };
  const ro=act.querySelector('[data-reopen]'); if(ro) ro.onclick=()=>{sess.done=false;persist('sessions',id,sess,0);render()};
}
function openSwap(sid,i){
  const sess=S.sessions[sid]; const e=sess.exercises[i]; const cur=EX[e.ex];
  let filter='same', q='';
  const body=()=>{
    const list=EXL.map(x=>EX[x[0]]).filter(x=>(filter==='same'?x.m===cur.m:filter==='all'?true:x.m===filter)&&(!q||x.n.toLowerCase().includes(q.toLowerCase())));
    return `<input class="in" id="swq" placeholder="${t('search')}" value="${esc(q)}">
    <div class="filters">${[['same',t('same')],['all',t('all')],...Object.keys(I18N.nl.mg).map(m=>[m,t('mg.'+m)])].map(([f,l])=>`<button data-f="${f}" class="${filter===f?'on':''}">${l}</button>`).join('')}</div>
    <label class="row" style="font-size:13px;gap:8px;padding:4px 0"><input type="checkbox" id="swRemember" style="width:20px;height:20px"> ${t('remember')}</label>
    <div class="lib">${list.map(x=>`<button data-ex="${x.id}" class="${x.id===e.ex?'cur':''}"><span><b>${esc(x.n)}</b><div class="m">${t('mg.'+x.m)} · ${x.e}</div></span>${x.id===e.orig?`<span class="dim" style="font-size:11px">${t('schema')}</span>`:''}</button>`).join('')}</div>`;
  };
  const bind=sh=>{
    sh.querySelector('#swq').oninput=ev=>{q=ev.target.value;const v=ev.target.value;sh.querySelector('.body').innerHTML=body();bind(sh);const qi=sh.querySelector('#swq');qi.focus();qi.setSelectionRange(v.length,v.length)};
    sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;sh.querySelector('.body').innerHTML=body();bind(sh)});
    sh.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{
      const nid=b.dataset.ex; const remember=sh.querySelector('#swRemember').checked;
      const base={sets:e.baseSets,reps:e.baseReps,w:nid===e.orig?e.baseW:null};
      const sg=suggest(sess.tpl,nid,base,sess.date);
      Object.assign(e,{ex:nid,tSets:sg.sets,tReps:sg.reps,tW:sg.w,why:sg.why,sets:Array.from({length:sg.sets},()=>({w:sg.w,r:null,rpe:null,ok:false}))});
      persist('sessions',sid,sess,0);
      if(remember||nid===e.orig){const st={...S.settings,swaps:{...(S.settings.swaps||{})}};st.swaps[sess.tpl]={...(st.swaps[sess.tpl]||{})};if(nid===e.orig)delete st.swaps[sess.tpl][e.slot];else st.swaps[sess.tpl][e.slot]=nid;persist('settings','main',st,0)}
      closeSheet(); render();
    });
  };
  openSheet(body(),bind);
}


/* ---------- SHARE IMAGE ---------- */
function openShare(k){
  const d=parseKey(k), p=planFor(d), dd=dayDoc(k);
  const sessions=sessionsOn(k).map(x=>S.sessions[x.id]).filter(Boolean).filter(sx=>sx.exercises.some(e=>loggedSets(e).length));
  const progDone=p?.prog&&dd.done;
  if(!sessions.length&&!progDone){toast(t('nothingYet'));return}
  const W=1080, M=64, colGap=24, colW=(W-2*M-colGap)/2;
  const c=document.createElement('canvas'); const g=c.getContext('2d');
  const F=(w,px)=>`${w} ${px}px Manrope, -apple-system, "Segoe UI", Roboto, sans-serif`;
  // measure height first
  let y=0; const blocks=[];
  const dateStr=`${t(DAYS[dayIdx(d)]+'L')} ${d.getDate()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  y=M+40; // eyebrow
  y+=96; // date
  y+=44; // week line
  y+=40;
  if(progDone){
    const lines=p.prog.lines.split('\n').filter(Boolean).slice(0,10);
    const hb=90+lines.length*34+90;
    blocks.push({type:'prog',y,h:hb,lines}); y+=hb+28;
  }
  sessions.forEach(sx=>{
    const tiles=sx.exercises.filter(e=>loggedSets(e).length).map(e=>({e,sets:loggedSets(e)}));
    const rows=[]; for(let i=0;i<tiles.length;i+=2){const a=tiles[i],b=tiles[i+1];const h=96+Math.max(a.sets.length,b?b.sets.length:0)*38+20;rows.push({a,b,h})}
    const hb=80+rows.reduce((s,r)=>s+r.h+16,0)+100;
    blocks.push({type:'gym',y,h:hb,sx,rows}); y+=hb+28;
  });
  const H=Math.max(1080,y+M);
  c.width=W;c.height=H;
  const acc='#16e36e';
  g.fillStyle='#0a0c0f';g.fillRect(0,0,W,H);
  g.fillStyle=acc;g.fillRect(0,0,W,10);
  g.textBaseline='top';
  g.fillStyle='#5d6875';g.font=F(800,24);g.letterSpacing='4px';g.fillText('HYROX TRAININGSLOG',M,M);g.letterSpacing='0px';
  g.fillStyle='#eef2f5';g.font=F(800,80);g.fillText(dateStr,M,M+40);
  g.fillStyle='#9aa5b1';g.font=F(600,32);g.fillText(`${t('week')} ${p.w}/10 · ${Math.max(0,Math.round((RACE-d)/864e5))} ${S.lang==='nl'?'dagen':'days'} ${t('toRace')}`,M,M+136);
  const rr=(x,y,w,h,r,fill,stroke)=>{g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}};
  const chip=(x,y,label,color,bg)=>{g.font=F(800,22);const w=g.measureText(label).width+36;rr(x,y,w,44,22,bg);g.fillStyle=color;g.fillText(label,x+18,y+11);return w};
  blocks.forEach(b=>{
    rr(M,b.y,W-2*M,b.h,28,'#13171c','#252c35');
    if(b.type==='prog'){
      const pr=p.prog; const col={hyrox:acc,run:'#4da3ff',other:'#9aa5b1',bike:'#ffb340',race:acc}[pr.type]||acc;
      chip(M+32,b.y+28,t(pr.type).toUpperCase(),col,'#1b2027');
      g.fillStyle='#eef2f5';g.font=F(600,28);
      b.lines.forEach((l,i)=>g.fillText(l,M+32,b.y+92+i*34));
      const stats=[[t('dist'),dd.dist!=null?num(dd.dist,2)+' km':pr.km!=null?num(pr.km,2)+' km':'–'],[t('time'),dd.time!=null?dd.time+' min':'–'],[t('rpe'),dd.rpe??pr.rpe??'–']];
      const sy=b.y+b.h-70; stats.forEach(([kk,v],i)=>{const x=M+32+i*300;g.fillStyle='#5d6875';g.font=F(800,20);g.fillText(kk.toUpperCase(),x,sy);g.fillStyle='#eef2f5';g.font=F(800,36);g.fillText(String(v),x,sy+24)});
    } else {
      const sx=b.sx; chip(M+32,b.y+28,t('gym').toUpperCase(),'#a78bfa','#1b2027');
      g.fillStyle='#eef2f5';g.font=F(800,40);g.fillText(t('gymNames.'+sx.tpl),M+32+160,b.y+24);
      let ty=b.y+96;
      b.rows.forEach(r=>{[r.a,r.b].forEach((tile,ci)=>{
        if(!tile)return; const x=M+32+ci*((W-2*M-64-colGap)/2+colGap); const tw=(W-2*M-64-colGap)/2;
        rr(x,ty,tw,r.h,18,'#1b2027');
        const ex=EX[tile.e.ex]; const best=bestBefore(tile.e.ex,k); const mx=Math.max(...tile.sets.map(s=>e1rm(s.w||0,s.r)));
        g.fillStyle='#eef2f5';g.font=F(800,28);let name=ex.n;while(g.measureText(name).width>tw-40-(best.be&&mx>best.be+0.5?60:0)&&name.length>4)name=name.slice(0,-2)+'…';g.fillText(name,x+20,ty+18);
        if(best.be&&mx>best.be+0.5){g.fillStyle=acc;g.font=F(800,20);g.fillText('PR',x+tw-50,ty+24)}
        g.fillStyle='#9aa5b1';g.font=F(700,20);g.fillText(t('mg.'+ex.m).toUpperCase(),x+20,ty+56);
        tile.sets.forEach((st,j)=>{const yy=ty+96+j*38;g.fillStyle='#5d6875';g.font=F(700,22);g.fillText(String(j+1),x+20,yy+4);g.fillStyle='#eef2f5';g.font=F(800,30);const wtxt=ex.inc===0?'BW':num(st.w,1)+' kg';g.fillText(wtxt,x+56,yy);g.fillStyle='#9aa5b1';g.font=F(700,26);g.fillText('× '+st.r,x+56+g.measureText(wtxt).width+16,yy+2);if(st.rpe!=null){g.fillStyle='#5d6875';g.font=F(700,20);g.textAlign='right';g.fillText('RPE '+st.rpe,x+tw-20,yy+6);g.textAlign='left'}});
      });ty+=r.h+16});
      let vol=0,n=0;sx.exercises.forEach(e=>loggedSets(e).forEach(st=>{vol+=(st.w||0)*st.r;n++}));
      const stats=[[t('totalVol'),num(vol,0)+' kg'],[t('sets'),n],[t('pr'),sx.prs||0]];
      const sy=b.y+b.h-76; stats.forEach(([kk,v],i)=>{const x=M+32+i*300;g.fillStyle='#5d6875';g.font=F(800,20);g.fillText(kk.toUpperCase(),x,sy);g.fillStyle=i===2&&v?acc:'#eef2f5';g.font=F(800,36);g.fillText(String(v),x,sy+24)});
    }
  });
  const url=c.toDataURL('image/png');
  openSheet(`<div class="eyebrow">${t('share')}</div><img src="${url}" alt="" style="width:100%;border-radius:14px;border:1px solid var(--line)"><div class="dim" style="font-size:13px;text-align:center">${t('shareHint')}</div>`);
}

/* ---------- SCHEMA ---------- */
function renderSchema(){
  head(t('schema'),'21-09 → 29-11');
  const tk=fmtKey(today()); const cw=Math.min(10,Math.max(1,weekOf(today())));
  if(S.openWeek==null) S.openWeek=cw;
  let total=0,done=0;
  for(let w=1;w<=10;w++)for(let di=0;di<7;di++){const s=dayStatus(fmtKey(dateFor(w,di)));total+=s.total;done+=s.done}
  let h=`<div class="card"><div class="row between"><div class="eyebrow">${t('progress')}</div><div class="num" style="font-size:14px">${done}/${total}</div></div><div class="bar" style="margin-top:8px"><i style="width:${total?done/total*100:0}%"></i></div></div>`;
  for(let w=1;w<=10;w++){
    let wt=0,wd=0; const rows=[];
    for(let di=0;di<7;di++){
      const d=dateFor(w,di),k=fmtKey(d),p=planFor(d),s=dayStatus(k); wt+=s.total;wd+=s.done;
      const chips=[]; if(p.prog)chips.push(`<span class="chip ${p.prog.type}" style="font-size:10px;padding:3px 6px">${t(p.prog.type)}</span>`); sessionsOn(k).forEach(x=>chips.push(`<span class="chip gym" style="font-size:10px;padding:3px 6px">${t('gym')}</span>`));
      const dots=[]; if(p.prog)dots.push(`<i class="dot ${dayDoc(k).done?'on':''}"></i>`); sessionsOn(k).forEach(x=>dots.push(`<i class="dot ${S.sessions[x.id]?.done?'on':''}"></i>`));
      rows.push(`<button class="dr ${k===tk?'today':''}" data-go="${k}"><span class="dn">${t(DAYS[di])}</span><span class="dd">${d.getDate()}-${String(d.getMonth()+1).padStart(2,'0')}</span><span class="grow row" style="gap:4px;flex-wrap:wrap">${chips.join('')||`<span class="dim" style="font-size:12px">${t('rest')}</span>`}</span><span class="dots">${dots.join('')}</span></button>`);
    }
    const open=S.openWeek===w;
    h+=`<div class="week ${w===cw?'cur':''}"><button class="wh" data-w="${w}"><span><b>${t('week')} ${w}</b>${w===6?` <span class="dim" style="font-size:12px">deload</span>`:w===10?` <span class="dim" style="font-size:12px">race</span>`:''}</span><span class="row" style="gap:10px"><span class="dim" style="font-size:12px">${wd}/${wt}</span>${ICONS[open?'left':'right'].replace('class="icon"','class="icon" style="width:16px;height:16px;transform:rotate('+(open?'-90':'90')+'deg)"')}</span></button>${open?`<div class="days">${rows.join('')}</div>`:''}</div>`;
  }
  $('#main').innerHTML=h;
  $('#main').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.openWeek=S.openWeek===+b.dataset.w?null:+b.dataset.w;render()});
  $('#main').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.date=b.dataset.go;S.view='today';$('#main').scrollTop=0;render()});
}

/* ---------- STATS ---------- */
function renderStats(){
  head(t('stats'),'');
  const tk=fmtKey(today()); const sl=sessionList().filter(s=>s.done);
  const cw=weekOf(today());
  const weekSess=sl.filter(s=>weekOf(parseKey(s.date))===cw);
  let wvol=0; weekSess.forEach(s=>s.exercises.forEach(e=>loggedSets(e).forEach(x=>wvol+=(x.w||0)*x.r)));
  // days done total & streak (consecutive planned days fully done, backwards from yesterday/today)
  let daysDone=0,planned=0; for(let w=1;w<=10;w++)for(let di=0;di<7;di++){const k=fmtKey(dateFor(w,di));if(k>tk)continue;const s=dayStatus(k);if(!s.total)continue;planned++;if(s.done===s.total)daysDone++}
  let streak=0; for(let d=today();d>=START;d=addDays(d,-1)){const s=dayStatus(fmtKey(d));if(!s.total)continue;if(s.done===s.total)streak++;else if(fmtKey(d)!==tk)break;}
  let h=`<div class="tiles">
    <div class="tile"><div class="k">${t('workouts')} ${t('thisWeek')}</div><div class="v">${weekSess.length}</div></div>
    <div class="tile"><div class="k">${t('volume')} ${t('thisWeek')}</div><div class="v">${num(wvol/1000,1)}<small>t</small></div></div>
    <div class="tile"><div class="k">${t('daysDone')}</div><div class="v">${daysDone}<small>/ ${planned}</small></div></div>
    <div class="tile"><div class="k">${t('streak')}</div><div class="v">${streak}<small>${t('day').toLowerCase()}${streak===1?'':S.lang==='nl'?'en':'s'}</small></div></div>
  </div>`;
  // heatmap
  let cells='';
  for(let w=1;w<=10;w++)for(let di=0;di<7;di++){const k=fmtKey(dateFor(w,di));const s=dayStatus(k);let c='';if(s.total){if(s.done===s.total)c='on';else if(s.done)c='half';else if(k<tk)c='miss'}cells+=`<i class="${c} ${k===tk?'today':''}" title="${k}"></i>`}
  h+=`<div class="card"><div class="eyebrow" style="margin-bottom:8px">${t('consistency')} · 10 ${t('week').toLowerCase()}s</div><div class="heat">${cells}</div></div>`;
  // exercise stats
  const exIds=[...new Set(sl.flatMap(s=>s.exercises.filter(e=>loggedSets(e).length).map(e=>e.ex)))];
  if(!exIds.length){h+=`<div class="card flat muted">${t('noData')}</div>`;$('#main').innerHTML=h;return}
  if(!S.statsEx||!exIds.includes(S.statsEx)) S.statsEx=exIds[0];
  h+=`<div class="field"><label>${t('pickEx')}</label><select class="in" id="stEx">${exIds.map(id=>`<option value="${id}" ${id===S.statsEx?'selected':''}>${esc(EX[id].n)}</option>`).join('')}</select></div>`;
  const pts=[]; sl.forEach(s=>s.exercises.filter(e=>e.ex===S.statsEx).forEach(e=>{const ls=loggedSets(e);if(!ls.length)return;let mw=0,me=0,vol=0,bs=null;ls.forEach(x=>{vol+=(x.w||0)*x.r;const ee=e1rm(x.w||0,x.r);if(ee>me){me=ee;bs=x}if((x.w||0)>mw)mw=x.w||0});pts.push({date:s.date,mw,me,vol,bs,n:ls.length,tpl:s.tpl})}));
  const maxE=Math.max(...pts.map(p=>p.me)),maxW=Math.max(...pts.map(p=>p.mw));
  h+=`<div class="tiles"><div class="tile"><div class="k">${t('e1rm')} ${t('pr')}</div><div class="v">${num(maxE,0)}<small>kg</small></div></div><div class="tile"><div class="k">${t('best')}</div><div class="v">${num(maxW,1)}<small>kg</small></div></div></div>`;
  h+=`<div class="card"><div class="eyebrow" style="margin-bottom:6px">${t('e1rm')}</div>${chart(pts.map(p=>p.me),pts.map(p=>p.date))}</div>`;
  h+=`<div class="card"><div class="eyebrow" style="margin-bottom:4px">${t('history')}</div><div class="hist">${pts.slice().reverse().map(p=>`<div class="r"><span><b>${p.date.slice(8,10)}-${p.date.slice(5,7)}</b> <span class="dim">${t('gymNames.'+p.tpl)}</span></span><span>${p.bs?`${num(p.bs.w,1)}×${p.bs.r}`:''} <span class="dim">· ${num(p.vol,0)} kg</span></span></div>`).join('')}</div></div>`;
  $('#main').innerHTML=h;
  $('#stEx').onchange=e=>{S.statsEx=e.target.value;render()};
}
function chart(vals,labels){
  const W=340,H=150,px=28,py=14; const n=vals.length;
  if(n<2) return `<div class="dim" style="font-size:12px;padding:8px 0">${n===1?`${num(vals[0],0)} kg`:t('noData')}</div>`;
  const min=Math.min(...vals)*0.95,max=Math.max(...vals)*1.03||1;
  const x=i=>px+(W-px-10)*(n===1?0.5:i/(n-1)), y=v=>py+(H-py*2)*(1-(v-min)/(max-min||1));
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area=`M${pts[0]} L${pts.join(' L')} L${x(n-1).toFixed(1)},${H-py} L${x(0).toFixed(1)},${H-py} Z`;
  const ticks=[min,(min+max)/2,max];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="e1RM">
    ${ticks.map(v=>`<line x1="${px}" x2="${W-10}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${px-4}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--fg3)" font-family="inherit">${Math.round(v)}</text>`).join('')}
    <path d="${area}" fill="rgba(22,227,110,.12)"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===n-1?4.5:3}" fill="${i===n-1?'var(--accent)':'var(--bg)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${x(0).toFixed(1)}" y="${H-1}" font-size="10" fill="var(--fg3)" font-family="inherit">${labels[0].slice(8,10)}-${labels[0].slice(5,7)}</text>
    <text x="${x(n-1).toFixed(1)}" y="${H-1}" font-size="10" fill="var(--fg3)" text-anchor="end" font-family="inherit">${labels[n-1].slice(8,10)}-${labels[n-1].slice(5,7)}</text>
  </svg>`;
}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  head(t('settings'),'');
  const swaps=S.settings.swaps||{}; const nSw=Object.values(swaps).reduce((a,o)=>a+Object.keys(o).length,0);
  let h=`<div class="card stack" style="gap:14px">
    <div class="field"><label>${t('lang')}</label><div class="seg"><button data-lang="nl" class="${S.lang==='nl'?'on':''}">Nederlands</button><button data-lang="en" class="${S.lang==='en'?'on':''}">English</button></div></div>
    <div class="field"><label>${t('bodyweight')} (kg)</label><input class="in" id="bw" type="number" inputmode="decimal" step="0.1" value="${S.settings.bodyweight??''}"></div>
    <div class="field"><label>${t('storage')}</label><div class="muted" style="font-size:14px">${S.storage==='ok'?t('storageCloud'):t('storageLocal')}</div></div>
  </div>
  <div class="card stack" style="gap:10px">
    <div class="eyebrow">${t('gym')}</div>
    ${Object.keys(TPL).map(id=>`<div class="stack" style="gap:2px"><b>${t('gymNames.'+id)}</b><div class="muted" style="font-size:13px">${TPL[id].ex.map(([e,s,r,w],i)=>{const sw=swaps[id]?.[i];return `${esc(EX[sw||e].n)} ${s}×${r}${w&&!sw?` @ ${num(w,2)}`:''}`}).join(' · ')}</div></div>`).join('')}
    ${nSw?`<button class="btn sm" data-act="resetSwaps">${t('resetSwaps')} (${nSw})</button>`:''}
  </div>
  <button class="btn block" data-act="export">${t('export')}</button>
  <div class="dim" style="font-size:12px;text-align:center">${t('install')}</div>`;
  $('#main').innerHTML=h;
  $('#main').querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;persist('settings','main',{...S.settings,lang:S.lang},0);render()});
  $('#bw').oninput=e=>persist('settings','main',{...S.settings,bodyweight:e.target.value===''?null:+e.target.value},700);
  const rs=$('#main').querySelector('[data-act="resetSwaps"]'); if(rs) rs.onclick=()=>{persist('settings','main',{...S.settings,swaps:{}},0);render()};
  $('#main').querySelector('[data-act="export"]').onclick=()=>{const txt=JSON.stringify({days:S.days,sessions:S.sessions,settings:S.settings},null,1);navigator.clipboard?.writeText(txt).then(()=>toast(t('copied'))).catch(()=>{openSheet(`<textarea class="in" style="min-height:300px;font-size:12px">${esc(txt)}</textarea>`)})};
}

/* ---------- SHEET & TOAST ---------- */
function openSheet(inner,bind){
  const el=$('#sheet'); el.innerHTML=`<div class="sheet-bg"><div class="sheet"><div class="grab"></div><div class="body">${inner}</div></div></div>`;
  el.querySelector('.sheet-bg').onclick=e=>{if(e.target===e.currentTarget)closeSheet()};
  if(bind) bind(el.querySelector('.sheet'));
}
function closeSheet(){$('#sheet').innerHTML=''}
let toastT; function toast(msg){const el=$('#toast');el.textContent=msg;el.className='toast';el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}

/* ---------- BOOT ---------- */
loadLocal();
S.date=fmtKey(today());
if(today()<START) S.date=fmtKey(START);
render();
initDb();
</script>
